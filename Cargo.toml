[package]
name = "inu-r132-cam-protocol"
version = "0.1.0"
edition = "2021"
description = "Serve and display the RGB (CGS_132 \"R132\") camera of an Inuitive NU4000"
license = "MIT"

[[bin]]
name = "inu-r132"
path = "src/bin/inu_r132.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libloading = "0.8"
log = "0.4"
minifb = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
] }

[build-dependencies]
cc = "1"
